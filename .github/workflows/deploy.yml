name: CI/CD Pipeline - Test, Build & Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Automated Testing & Verification (Continuous Integration)
  # ------------------------------------------------------------------
  test-and-verify:
    name: Build & Test (Backend + Frontend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: enterprise_rag_db
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Backend Verification
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Test & Package Spring Boot Backend
        working-directory: ./backend
        run: |
          chmod +x mvnw
          ./mvnw clean test

      # Frontend Verification
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Next.js Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  # ------------------------------------------------------------------
  # JOB 2: Automated Deployment to AWS EC2 (Continuous Deployment)
  # ------------------------------------------------------------------
  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: test-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting automated deployment on AWS EC2..."
            
            # Navigate to project repository directory
            cd ~/enterprise-rag-engine || {
              echo "Repository directory not found! Cloning for the first time..."
              cd ~
              git clone https://github.com/${{ github.repository }}.git
              cd enterprise-rag-engine
            }

            # Pull latest code from main branch
            echo "📥 Pulling latest commits from GitHub..."
            git fetch --all
            git reset --hard origin/main

            # Build and deploy production containers
            echo "🐳 Building and spinning up production containers..."
            docker compose -f docker-compose.prod.yml up --build -d --remove-orphans

            # Clean up old unused images to preserve disk space on EC2
            echo "🧹 Pruning unused Docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
